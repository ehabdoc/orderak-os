server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache static assets (hashed by Vite, safe to cache)
  location ~* \.(js|css|png|jpg|jpeg|svg|webp|woff2|ico|webmanifest)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # Service worker files: must NEVER be cached aggressively
  location ~ /sw\.js$|/workbox-.*\.js$|/registerSW\.js$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
    try_files $uri =404;
  }

  # Health endpoint for the container
  location = /health {
    add_header Content-Type application/json;
    return 200 '{"status":"ok","service":"orderak-web"}';
  }

  # Proxy API calls to the API service (internal Docker network)
  location /api/ {
    proxy_pass http://api:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Long timeouts for sync of large syncQueue
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
