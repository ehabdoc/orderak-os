# Render Blueprint — one-click deploy for Orderak OS (single service, one URL).
# Usage: Render Dashboard → New → Blueprint → pick this repo → Apply.
# Free plan: no persistent disk (Render disks need a paid plan). The SQLite
# file lives on the container filesystem and the entrypoint auto-seeds
# default users/menu on empty DB — perfect for a demo. Data resets on
# redeploy/restart. For permanent data, upgrade the service to Starter
# and add a disk mounted at /app/data.
services:
  - type: web
    name: orderak
    runtime: docker
    dockerfilePath: ./Dockerfile.single
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: true
      - key: DATABASE_URL
        value: file:/app/data/orderak.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value:
